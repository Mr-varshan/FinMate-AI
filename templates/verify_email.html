<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Email | FinMate AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-page"><section class="auth-card verify-card">
<div class="auth-logo">✉</div>
<h1>Verify your email</h1>
<p class="muted">Step 2 of 3 — We sent a 6-digit OTP to<br><strong>{{ email }}</strong></p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}<div class="auth-{{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>{% endfor %}
{% endwith %}
<form method="post" class="auth-form">
<label>Verification OTP
<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autocomplete="one-time-code" class="otp-input">
</label>
<button class="primary" type="submit">Verify Email</button>
</form>
<form method="post" action="{{ url_for('resend_otp') }}" class="resend-form">
<button class="secondary-btn" type="submit">Resend OTP</button>
</form>
<p class="auth-footer">After verification, you will create your password.</p>
</section></main>
</body></html>
