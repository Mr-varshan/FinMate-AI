<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Password | FinMate AI</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="auth-page"><section class="auth-card">
<div class="auth-logo">✓</div><h1>Email verified</h1>
<p class="muted">Step 3: Your email <strong>{{ email }}</strong> is verified. Now create your password.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,message in messages %}<div class="auth-{{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
<form method="post" class="auth-form">
<label>Password<input name="password" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters"></label>
<label>Confirm Password<input name="confirm_password" type="password" minlength="6" required autocomplete="new-password" placeholder="Re-enter your password"></label>
<button class="primary" type="submit">Create Account</button></form>
</section></main></body></html>
