<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | CampusMoney AI</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-page"><div class="auth-card"><div class="auth-logo">🌱</div><h1>Create your account</h1><p>Your expenses and budgets will be private to your account.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post" class="auth-form"><label>Full name<input type="text" name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required placeholder="Minimum 6 characters"></label><button class="primary" type="submit">Create account</button></form><p class="auth-footer">Already have an account? <a href="/login">Login</a></p></div></body></html>
