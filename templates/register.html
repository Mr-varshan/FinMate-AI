<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | FinMate AI</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="auth-page"><section class="auth-card"><div class="auth-logo">₹</div><h1>Create your account</h1><p class="muted">Start managing your student finances.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post" class="auth-form"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button class="primary">Create Account</button></form><p class="auth-footer">Already registered? <a href="{{ url_for('login') }}">Login</a></p></section></main></body></html>
